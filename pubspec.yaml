name: libertad_financiera_premium
description: App premium de educación financiera con mentor de voz, basada en los mejores libros de finanzas e inversión.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.0.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
